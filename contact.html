<!DOCTYPE html>
<html>

<head>
    <title>Contact - Krishisattva Egg Farms</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>

<body>

<div class="container">

<header class="header">

    <h1>Krishisattva Egg Farms</h1>

    <nav class="nav">
        <a href="index.html">Home</a>
        <a href="eggs.html">Eggs</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>

    <button id="theme-toggle">☀</button>

</header>

<main class="contact-page">

<div class="fade-in">
    <h1>Contact Us</h1>

    <p class="intro">
        We'd love to hear from you.
    </p>
</div>

<section class="contact-card">
    <h3>📧 Email</h3>
    <p>rithikruttala@gmail.com</p>
</section>

<section class="contact-card">
    <h3>📞 Phone</h3>
    <p>---</p>
</section>
<section class="contact-card">
    <h3>📩 Send us a Message</h3>
    <form id="contact-form">
        <div class="hidden-field">
        <label>If you are human, leave this blank:</label>
        <input type="text" name="honeypot" id="honeypot-field" tabindex="-1" autocomplete="off">
    </div>
        <input type="hidden" name="title" value="New Inquiry from Website">
        
        <div style="margin-bottom: 15px;">
            <input type="text" name="name" placeholder="Your Name" required 
                   style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #2a2a2a; background: #1b1b1b; color: white;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <input type="email" name="email" placeholder="Your Email" required 
                   style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #2a2a2a; background: #1b1b1b; color: white;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <textarea name="message" placeholder="How can we help?" required 
                      style="width: 100%; height: 100px; padding: 10px; border-radius: 8px; border: 1px solid #2a2a2a; background: #1b1b1b; color: white;"></textarea>
        </div>
        
        <button type="submit" id="submit-btn" class="cta-button" style="border: none; cursor: pointer; width: 100%;">
            Send Message
        </button>
    </form>
    <p id="form-status" style="margin-top: 15px; text-align: center; display: none;"></p>
</section>
</main>

</div>

<footer class="footer">
    <p>© 2026 Krishisattva Egg Farms.</p>
</footer>

<script src="script.js"></script>

</body>
</html>
